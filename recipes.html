<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriLife - Recipes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav>
        <a href="Task.html" class="logo">
            <i class="fa-solid fa-leaf"></i> NutriLife
        </a>
        <div class="nav-links">
            <a href="Task.html">Home</a>
            <a href="tracking.html">Tracking</a>
            <a href="recipes.html">Recipes</a>
            <a href="meal-plan.html">Meal Plan</a>
            <a href="#" class="nav-login-btn" id="login-btn">Login</a>
        </div>
    </nav>

    <section class="recipes" id="recipes" style="padding-top: 10rem;">
        <h2 class="section-title">Trending Healthy Recipes</h2>
        
        <div class="recipe-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="veg">Veg</button>
            <button class="filter-btn" data-filter="non-veg">Non-Veg</button>
        </div>

        <div class="recipe-grid" id="main-recipe-grid">
            <!-- Dynamically populated by recipesData.js & script.js -->
        </div>
    </section>

    <!-- Recipe Detail Modal -->
    <div class="modal-overlay" id="recipe-modal">
        <div class="modal-content recipe-modal-content">
            <button class="close-modal" id="close-recipe-modal"><i class="fa-solid fa-xmark"></i></button>
            <div class="recipe-modal-grid">
                <div class="rm-image-col">
                    <img src="" alt="Recipe Image" id="rm-image">
                </div>
                <div class="rm-info-col">
                    <h2 class="modal-title" id="rm-title" style="text-align: left; margin-bottom: 1rem;">Recipe Title</h2>
                    <div class="recipe-meta" style="margin-bottom: 2rem;">
                        <span><i class="fa-solid fa-fire"></i> <span id="rm-cals"></span> kcal</span>
                        <span style="margin-left: 1rem;"><i class="fa-solid fa-clock"></i> <span id="rm-time"></span></span>
                        <span style="margin-left: 1rem; text-transform: uppercase; color: var(--accent-color); font-weight: 800;" id="rm-cat"></span>
                    </div>
                    
                    <h3 style="margin-bottom: 0.5rem;">Ingredients</h3>
                    <ul id="rm-ingredients" class="rm-list">
                    </ul>

                    <h3 style="margin-top: 1.5rem; margin-bottom: 0.5rem;">Instructions</h3>
                    <ol id="rm-instructions" class="rm-list">
                    </ol>
                </div>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal-overlay" id="login-modal">
        <div class="modal-content">
            <button class="close-modal" id="close-modal"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="modal-title">Welcome Back</h2>
            <p class="modal-subtitle">Log in to track your nutrition</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn login-submit-btn">Log In</button>
                <p class="modal-footer">Don't have an account? <a href="#">Sign up</a></p>
            </form>
        </div>
    </div>

    <script src="recipesData.js"></script>
    <script src="script.js"></script>
</body>
</html>
